<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fagulado GX — Salary Slip Generator</title>
<style>
  :root{
    --ink:#15171a;            /* near-black */
    --ink-soft:#4a4f55;
    --line:#d7dadf;
    --line-strong:#22252a;
    --amber:#f4c430;          /* subtle yellow */
    --amber-soft:#fdf6df;     /* very light yellow wash */
    --amber-line:#e8c14a;
    --bg:#eef0f3;
    --card:#ffffff;
    --green:#157347;
    --shadow:0 10px 30px rgba(20,23,26,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.45;
  }

  /* ---------- Layout ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    padding:22px 18px 60px;
    display:grid;
    grid-template-columns:340px 1fr;
    gap:24px;
    align-items:start;
  }
  @media (max-width:880px){
    .app{grid-template-columns:1fr; gap:18px; padding:14px 12px 48px}
  }

  /* ---------- Controls panel ---------- */
  .panel{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:18px 16px;
    position:sticky;
    top:14px;
  }
  @media (max-width:880px){ .panel{position:static} }
  .panel h1{
    font-size:15px;
    margin:0 0 2px;
    letter-spacing:.3px;
  }
  .panel .sub{font-size:12px;color:var(--ink-soft);margin:0 0 14px}
  .panel .brandline{
    display:inline-block;width:34px;height:4px;border-radius:3px;
    background:var(--amber);margin-bottom:12px;
  }
  .field{margin-bottom:11px}
  .field label{
    display:block;font-size:11px;font-weight:600;text-transform:uppercase;
    letter-spacing:.5px;color:var(--ink-soft);margin-bottom:4px;
  }
  .field input, .field select{
    width:100%;padding:9px 10px;font-size:14px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink);outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--amber);box-shadow:0 0 0 3px rgba(244,196,48,.25)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .group-title{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
    color:var(--ink);margin:18px 0 8px;padding-bottom:6px;border-bottom:1px dashed var(--line);
  }
  .months{display:flex;flex-direction:column;gap:10px}
  .monthcard{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fbfbfc}
  .monthcard .mc-head{font-size:13px;font-weight:700;margin-bottom:8px}
  .btnrow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
  button.action{
    flex:1;min-width:120px;padding:11px 12px;font-size:13px;font-weight:700;cursor:pointer;
    border-radius:9px;border:1px solid var(--line-strong);background:var(--ink);color:#fff;
    letter-spacing:.3px;transition:transform .05s ease;
  }
  button.action.ghost{background:#fff;color:var(--ink)}
  button.action.amber{background:var(--amber);border-color:var(--amber-line);color:#1a1a1a}
  button.action:active{transform:translateY(1px)}
  .logo-row{display:flex;gap:8px;align-items:center;margin-top:4px}
  .logo-row .filebtn{
    font-size:12px;padding:8px 10px;border:1px dashed var(--line-strong);border-radius:8px;
    cursor:pointer;background:#fff;font-weight:600;
  }
  .hint{font-size:11px;color:var(--ink-soft);margin-top:6px;line-height:1.4}

  /* ---------- Preview area ---------- */
  .preview-wrap{min-width:0}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{
    padding:8px 14px;font-size:13px;font-weight:600;border-radius:999px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink-soft);
  }
  .tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* ---------- The slip ---------- */
  .slips{display:flex;flex-direction:column;gap:26px}
  .slip{
    background:#fff;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden;
    box-shadow:var(--shadow);max-width:820px;margin:0 auto;width:100%;
  }
  .slip-head{
    display:flex;align-items:center;gap:16px;padding:20px 24px;
    border-bottom:3px solid var(--amber);background:linear-gradient(180deg,#fffdf4,#ffffff);
  }
  .logo-box{
    width:60px;height:60px;flex:0 0 60px;border-radius:10px;border:1.5px solid var(--ink);
    background:var(--amber);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:11px;color:#1a1a1a;text-align:center;overflow:hidden;
  }
  .logo-box img{width:100%;height:100%;object-fit:contain;background:#fff}
  .head-text{flex:1;min-width:0}
  .head-text .co{font-size:22px;font-weight:800;letter-spacing:.5px;line-height:1.1}
  .head-text .tag{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .head-right{text-align:right;flex:0 0 auto}
  .head-right .ps{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
    background:var(--ink);color:#fff;padding:3px 10px;border-radius:5px;display:inline-block;
  }
  .head-right .pm{font-size:13px;font-weight:700;margin-top:6px}

  .emp-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:0;
    border-bottom:1px solid var(--line);
  }
  @media (max-width:560px){.emp-grid{grid-template-columns:1fr}}
  .emp-cell{padding:9px 24px;display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line)}
  .emp-cell .k{color:var(--ink-soft);font-weight:600}
  .emp-cell .v{font-weight:700;text-align:right}

  .ed-wrap{display:grid;grid-template-columns:1fr 1fr;gap:0}
  @media (max-width:560px){.ed-wrap{grid-template-columns:1fr}}
  table.ed{width:100%;border-collapse:collapse;font-size:13px}
  table.ed th{
    text-align:left;padding:9px 24px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;
    background:var(--amber-soft);border-bottom:1.5px solid var(--amber-line);
  }
  table.ed th.amt, table.ed td.amt{text-align:right;font-variant-numeric:tabular-nums}
  table.ed td{padding:8px 24px;border-bottom:1px solid var(--line)}
  table.ed .lbl{color:var(--ink)}
  table.ed tr.sub td{color:var(--ink-soft);font-size:12px}
  .ed-left{border-right:1px solid var(--line)}
  @media (max-width:560px){.ed-left{border-right:none;border-bottom:1px solid var(--line)}}
  table.ed tr.total td{font-weight:800;background:#fafafa;border-top:1.5px solid var(--line-strong)}

  .netbar{
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 24px;background:var(--ink);color:#fff;
  }
  .netbar .nl{font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:700;color:var(--amber)}
  .netbar .nv{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
  .words{padding:10px 24px;font-size:12px;color:var(--ink-soft);border-bottom:1px solid var(--line);background:#fffdf4}
  .words b{color:var(--ink)}
  .slip-foot{padding:12px 24px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--ink-soft)}
  .slip-foot .sig{text-align:right}

  /* ---------- Print ---------- */
  @media print{
    body{background:#fff}
    .panel,.tabs,.noprint{display:none !important}
    .app{display:block;max-width:none;padding:0;margin:0}
    .slips{gap:0}
    .slip{box-shadow:none;border:1px solid #000;border-radius:0;max-width:none;margin:0 0 14px;
      page-break-inside:avoid;break-inside:avoid;}
    @page{margin:14mm}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ===================== CONTROLS ===================== -->
  <aside class="panel noprint">
    <span class="brandline"></span>
    <h1>Salary Slip Generator</h1>
    <p class="sub">Fagulado GX • live preview • print to PDF</p>

    <div class="field">
      <label>Company Logo</label>
      <div class="logo-row">
        <label class="filebtn">Upload logo<input id="logoInput" type="file" accept="image/*" hidden></label>
        <button class="filebtn" id="logoClear" type="button">Clear</button>
      </div>
      <p class="hint">Optional. Falls back to a "GX" placeholder.</p>
    </div>

    <div class="group-title">Employee</div>
    <div class="field"><label>Employee Name</label><input id="empName" value="Employee Name"></div>
    <div class="field"><label>Designation</label><input id="empDesig" value="Software Engineer"></div>
    <div class="row2">
      <div class="field"><label>Employee ID</label><input id="empId" value="FGX-001"></div>
      <div class="field"><label>PAN Number</label><input id="empPan" value="ABCDE1234F" maxlength="10" style="text-transform:uppercase"></div>
    </div>

    <div class="group-title">Salary</div>
    <div class="field">
      <label>Monthly Gross Salary (₹)</label>
      <input id="gross" type="number" min="0" step="100" value="58000">
      <p class="hint">Split as Basic 40% • HRA 20% • Special Allowance 40%.</p>
    </div>
    <div class="row2">
      <div class="field"><label>Professional Tax (₹)</label><input id="ptax" type="number" min="0" step="10" value="200"></div>
      <div class="field">
        <label>Provident Fund</label>
        <select id="pfOn"><option value="yes" selected>12% of Basic</option><option value="no">No PF</option></select>
      </div>
    </div>

    <div class="group-title">Months &amp; Leaves</div>
    <div class="months" id="monthControls"></div>

    <div class="btnrow">
      <button class="action amber" id="printOne" type="button">Print this slip</button>
      <button class="action" id="printAll" type="button">Print all 3</button>
    </div>
    <p class="hint">Tip: in the print dialog choose “Save as PDF”. On mobile, long-press the slip to screenshot.</p>
  </aside>

  <!-- ===================== PREVIEW ===================== -->
  <main class="preview-wrap">
    <div class="tabs noprint" id="tabs"></div>
    <div class="slips" id="slips"></div>
  </main>
</div>

<script>
/* ------------------- State ------------------- */
const YEAR = 2026;
const MONTHS = [
  { key:"jan", name:"January",  year:YEAR, days:31, leave:1 },
  { key:"feb", name:"February", year:YEAR, days:28, leave:1 },
  { key:"mar", name:"March",    year:YEAR, days:31, leave:2 },
];
const state = {
  empName:"Employee Name",
  empDesig:"Software Engineer",
  empId:"FGX-001",
  empPan:"ABCDE1234F",
  gross:58000,
  ptax:200,
  pf:true,
  logo:null,
  active:"jan",
  months:MONTHS.map(m=>({...m})),
};

/* ------------------- Helpers ------------------- */
const inr = n => "₹" + Number(Math.round(n*100)/100).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const inr0 = n => "₹" + Number(Math.round(n)).toLocaleString("en-IN");

function numToWords(num){
  num = Math.round(num);
  if(num===0) return "Zero";
  const a=["","One","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Eleven","Twelve","Thirteen","Fourteen","Fifteen","Sixteen","Seventeen","Eighteen","Nineteen"];
  const b=["","","Twenty","Thirty","Forty","Fifty","Sixty","Seventy","Eighty","Ninety"];
  const two = n => n<20 ? a[n] : b[Math.floor(n/10)] + (n%10? " "+a[n%10] : "");
  const three = n => (n>=100 ? a[Math.floor(n/100)]+" Hundred"+(n%100? " "+two(n%100):"") : two(n));
  let res="", crore=Math.floor(num/10000000); num%=10000000;
  let lakh=Math.floor(num/100000); num%=100000;
  let thou=Math.floor(num/1000); num%=1000;
  let hund=num;
  if(crore) res+=three(crore)+" Crore ";
  if(lakh)  res+=two(lakh)+" Lakh ";
  if(thou)  res+=two(thou)+" Thousand ";
  if(hund)  res+=three(hund);
  return res.trim();
}

/* ------------------- Calculation ------------------- */
function calc(m){
  const g = state.gross;
  const basic = g*0.40, hra = g*0.20, special = g*0.40;
  const perDay = g / m.days;
  const lop = perDay * m.leave;               // loss of pay (unpaid leave)
  const pf = state.pf ? basic*0.12 : 0;
  const ptax = state.ptax;
  const totalEarn = g;
  const totalDed = pf + ptax + lop;
  const net = totalEarn - totalDed;
  return { basic,hra,special,perDay,lop,pf,ptax,totalEarn,totalDed,net,
           paidDays:m.days-m.leave };
}

/* ------------------- Render slip ------------------- */
function logoHtml(){
  return state.logo
    ? `<div class="logo-box"><img src="${state.logo}" alt="logo"></div>`
    : `<div class="logo-box">GX</div>`;
}

function slipHtml(m){
  const c = calc(m);
  const pfRow = state.pf
    ? `<tr><td class="lbl">Provident Fund (12% of Basic)</td><td class="amt">${inr(c.pf)}</td></tr>`
    : "";
  return `
  <div class="slip">
    <div class="slip-head">
      ${logoHtml()}
      <div class="head-text">
        <div class="co">FAGULADO GX</div>
        <div class="tag">Payslip · Confidential</div>
      </div>
      <div class="head-right">
        <span class="ps">Salary Slip</span>
        <div class="pm">${m.name} ${m.year}</div>
      </div>
    </div>

    <div class="emp-grid">
      <div class="emp-cell"><span class="k">Employee Name</span><span class="v">${esc(state.empName)}</span></div>
      <div class="emp-cell"><span class="k">Employee ID</span><span class="v">${esc(state.empId)}</span></div>
      <div class="emp-cell"><span class="k">Designation</span><span class="v">${esc(state.empDesig)}</span></div>
      <div class="emp-cell"><span class="k">PAN Number</span><span class="v">${esc(state.empPan).toUpperCase()}</span></div>
      <div class="emp-cell"><span class="k">Pay Period</span><span class="v">${m.name} ${m.year}</span></div>
      <div class="emp-cell"><span class="k">Total Days</span><span class="v">${m.days}</span></div>
      <div class="emp-cell"><span class="k">Paid Days</span><span class="v">${c.paidDays}</span></div>
      <div class="emp-cell"><span class="k">LOP / Unpaid Leave</span><span class="v">${m.leave} day${m.leave===1?"":"s"}</span></div>
    </div>

    <div class="ed-wrap">
      <div class="ed-left">
        <table class="ed">
          <tr><th>Earnings</th><th class="amt">Amount</th></tr>
          <tr><td class="lbl">Basic Salary (40%)</td><td class="amt">${inr(c.basic)}</td></tr>
          <tr><td class="lbl">House Rent Allowance (20%)</td><td class="amt">${inr(c.hra)}</td></tr>
          <tr><td class="lbl">Special Allowance (40%)</td><td class="amt">${inr(c.special)}</td></tr>
          <tr class="total"><td>Gross Earnings</td><td class="amt">${inr(c.totalEarn)}</td></tr>
        </table>
      </div>
      <div class="ed-right">
        <table class="ed">
          <tr><th>Deductions</th><th class="amt">Amount</th></tr>
          ${pfRow}
          <tr><td class="lbl">Professional Tax</td><td class="amt">${inr(c.ptax)}</td></tr>
          <tr><td class="lbl">Unpaid Leave (${m.leave} × ${inr(c.perDay)}/day)</td><td class="amt">${inr(c.lop)}</td></tr>
          <tr class="total"><td>Total Deductions</td><td class="amt">${inr(c.totalDed)}</td></tr>
        </table>
      </div>
    </div>

    <div class="netbar">
      <span class="nl">Net Pay (In-hand)</span>
      <span class="nv">${inr(c.net)}</span>
    </div>
    <div class="words">Amount in words: <b>${numToWords(c.net)} Rupees Only</b></div>

    <div class="slip-foot">
      <div>Per-day rate: ${inr(c.perDay)} &nbsp;(${inr0(state.gross)} ÷ ${m.days} days)<br>
           This is a computer-generated payslip and does not require a signature.</div>
      <div class="sig">For <b>Fagulado GX</b><br><br>Authorised Signatory</div>
    </div>
  </div>`;
}

function esc(s){return String(s).replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));}

/* ------------------- Render UI ------------------- */
function renderTabs(){
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = state.months.map(m=>
    `<div class="tab ${state.active===m.key?"active":""}" data-k="${m.key}">${m.name} ${m.year}</div>`
  ).join("") + `<div class="tab ${state.active==="all"?"active":""}" data-k="all">All 3 stacked</div>`;
  tabs.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{state.active=t.dataset.k;render();});
}
function renderSlips(){
  const box = document.getElementById("slips");
  const list = state.active==="all" ? state.months : state.months.filter(m=>m.key===state.active);
  box.innerHTML = list.map(slipHtml).join("");
}
function renderMonthControls(){
  const box = document.getElementById("monthControls");
  box.innerHTML = state.months.map((m,i)=>`
    <div class="monthcard">
      <div class="mc-head">${m.name} ${m.year}</div>
      <div class="row2">
        <div class="field" style="margin:0"><label>Days in month</label>
          <input type="number" min="28" max="31" data-i="${i}" data-f="days" value="${m.days}"></div>
        <div class="field" style="margin:0"><label>Unpaid leaves</label>
          <input type="number" min="0" max="${m.days}" step="1" data-i="${i}" data-f="leave" value="${m.leave}"></div>
      </div>
    </div>`).join("");
  box.querySelectorAll("input").forEach(inp=>inp.oninput=()=>{
    const i=+inp.dataset.i, f=inp.dataset.f;
    state.months[i][f] = Math.max(0, +inp.value||0);
    renderSlips();
  });
}
function render(){ renderTabs(); renderSlips(); }

/* ------------------- Bind controls ------------------- */
function bind(id,key,isNum){
  const el=document.getElementById(id);
  el.oninput=()=>{ state[key]= isNum? (+el.value||0) : el.value; renderSlips(); };
}
bind("empName","empName");
bind("empDesig","empDesig");
bind("empId","empId");
bind("empPan","empPan");
bind("gross","gross",true);
bind("ptax","ptax",true);
document.getElementById("pfOn").onchange=e=>{state.pf=e.target.value==="yes";renderSlips();};

document.getElementById("logoInput").onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{state.logo=r.result;renderSlips();}; r.readAsDataURL(f);
};
document.getElementById("logoClear").onclick=()=>{state.logo=null;renderSlips();};

document.getElementById("printOne").onclick=()=>{
  if(state.active==="all"){window.print();return;}
  window.print();
};
document.getElementById("printAll").onclick=()=>{state.active="all";render();setTimeout(()=>window.print(),60);};

/* ------------------- Init ------------------- */
renderMonthControls();
render();
</script>
</body>
</html>
